[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pcapng-audit"
version = "1.0.0"
description = "Unified PCAPNG timestamp/order audit service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
