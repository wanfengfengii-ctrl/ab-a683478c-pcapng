name: pcapng-audit

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: pcapng-audit:latest
    environment:
      PORT: "8080"
    ports:
      # Host port is configurable via the HOST_PORT env var.
      - "${HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  verify:
    image: pcapng-audit:latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: "http://api:8080"
    entrypoint: ["/bin/sh", "scripts/verify.sh"]
    restart: "no"
